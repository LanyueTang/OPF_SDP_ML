# exp_debug.yaml  —— 最小可运行配置（用于整体流程 debug）

seed: 42

# ======================
# 数据读取（Reader 版本化）
# ======================
data:
  npz_path : "/home/goatoine/Documents/Lanyue/data/data_for_GCN/data_basic_GCN/case2746wop_0128_samples.npz"
  # 0128:solvetime
  # 0129:solvetime
  # 0127:log(solvetime)
  # 1118:regret
  reader: "opf_vA_balance_test_adjmode"
  adj_mode: "real" #"real";"identity";"random";"random_deg";"nobalmatrix"
  num_workers: 4
  norm: zscore  # used in main 

# ===============
# 训练超参数
# ===============
train:
  batch_size: 32
  epochs: 20
  lr: 4.0e-4

  # # 下面三项先按需开关；不需要就保留默认
  # amp: false           # 混合精度
  # grad_clip: null      # 例如 1.0
  # accum_steps: 1       # 梯度累积步数

  # # 学习率调度器（先关掉；需要时换成 steplr / cosine）
  scheduler: null
  # scheduler:
  #   name: "steplr"
  #   step_size: 10
  #   gamma: 0.5

  # # 早停（验证指标是 val_mae；不需要就设为 null）
  early_stop: null
  # # early_stop:
  # #   patience: 5
  # #   mode: "min"
  # #   min_delta: 1.0e-4

# ==================
# 模型（GCNGlobal）
# ==================
# model:
#   name: "gcn_basicA_nhop"
#   hidden: 64
#   layers: 2
#   readout: "mean"          # mean | sum | max
#   out_scalar: None       
#   out_array_dim: 6      
#   n_hops: 2       # n-hop 聚合
#   dropout: 0.2
model:
  name: "gcn_basicA_appnp"
  hidden: 64
  layers: 1
  readout: "mean"          # mean | sum | max
  out_scalar: None       
  out_array_dim: 6           # n-hop 聚合
  dropout: 0.2
# ==================
# 损失（按需切换）
# ==================
loss:
  name: "arr_mse"

# ==================
# 任务 / 日志 / 模型保存
# ==================
task:
  name: "opf_basicA_task"



# ==================
# 测试评估（evaluate.py）
# ==================
evaluator:
  name: "arr_rsm_runtime"
  output_dir: "/home/goatoine/Documents/Lanyue/models/GNN/result/Mar2_appnp_m1_arr_mse"

logger:
  log_dir: "/home/goatoine/Documents/Lanyue/models/GNN/result/Mar2_appnp_m1_arr_mse/log"